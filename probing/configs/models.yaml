# (probing/scripts/run.sh, train_probes.py, plot_regenerated_probes.py,
# plot_paper_probes.py). Maps short names to Hugging Face checkpoints.
models:
  Qwen-8B: Qwen/Qwen3-Embedding-8B
  BGE-large: BAAI/bge-large-en-v1.5
  Nemotron-8B: nvidia/llama-embed-nemotron-8b
  Octen-8B: Octen/Octen-Embedding-8B

# Models plotted in the probe figures, in legend and color order.
subset: [Qwen-8B, BGE-large, Nemotron-8B, Octen-8B]
