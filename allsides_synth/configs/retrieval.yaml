run:
  tag: allsides_synth

# The committed corpus keeps Qbias articles of at least 100 characters and
# enforces equal left/right article counts within each roundup (see the
# "Balanced corpus" section of allsides_synth/README.md).

retrieval:
  max_seq_length: 512
  top_k: 100
  encoders:
    - name: BAAI/bge-large-en-v1.5
      batch_size: 32
      devices: [cuda:0]
    - name: Qwen/Qwen3-Embedding-8B
      batch_size: 8
      torch_dtype: bfloat16
      devices: [cuda:1, cuda:2]
    - name: nvidia/llama-embed-nemotron-8b
      batch_size: 8
      torch_dtype: bfloat16
      trust_remote_code: true
      devices: [cuda:3, cuda:4]
    - name: Octen/Octen-Embedding-8B
      batch_size: 8
      torch_dtype: bfloat16
      devices: [cuda:5, cuda:6]
    - name: openai/text-embedding-3-large
      provider: openai
      batch_size: 100
